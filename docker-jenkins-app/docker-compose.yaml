services:
  api:
    build: ./api
    container_name: ecommerce-api
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://ecommerce:devpassword@db:5432/ecommerce
    depends_on:
      db:
        condition: service_healthy  

  frontend:
    image: nginx:alpine
    container_name: ecommerce-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - api 

  db:
    image: postgres:16-alpine
    container_name: ecommerce-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: ecommercedb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommercedb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    expose:
      - "6379"

  
  worker:
    build: ./worker
    container_name: ecommerce-worker
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://ecommerce:devpassword@db:5432/ecommerce
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  jenkins:
    build: ./jenkins
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home

  jenkins-agent:
    build: ./jenkins-agent
    container_name: jenkins-agent
    restart: unless-stopped
    init: true
    depends_on:
      - jenkins
    environment:
      JENKINS_URL: http://jenkins:8080
      JENKINS_AGENT_NAME: docker-agent
      JENKINS_SECRET: ${JENKINS_AGENT_SECRET:?Set JENKINS_AGENT_SECRET in your .env file}
      JENKINS_AGENT_WORKDIR: /home/jenkins/agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - jenkins_agent_work:/home/jenkins/agent  


volumes:
  postgres_data:
  jenkins_home:
  jenkins_agent_work: